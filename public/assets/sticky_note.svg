<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750">
  <defs>
    <filter id="paper-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="tape-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="paper-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
  </defs>

  <!-- Sticky Paper Body -->
  <rect x="20" y="20" width="560" height="710" rx="8" fill="url(#paper-grad)" stroke="#fde047" stroke-width="1.5"/>

  <!-- Notebook Lines -->
  <g stroke="#eab308" stroke-width="1" stroke-opacity="0.28">
    <line x1="50" y1="140" x2="550" y2="140"/>
    <line x1="50" y1="200" x2="550" y2="200"/>
    <line x1="50" y1="260" x2="550" y2="260"/>
    <line x1="50" y1="320" x2="550" y2="320"/>
    <line x1="50" y1="380" x2="550" y2="380"/>
    <line x1="50" y1="440" x2="550" y2="440"/>
    <line x1="50" y1="500" x2="550" y2="500"/>
    <line x1="50" y1="560" x2="550" y2="560"/>
    <line x1="50" y1="620" x2="550" y2="620"/>
  </g>

  <!-- Red Margin Line -->
  <line x1="100" y1="40" x2="100" y2="710" stroke="#f87171" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Washi Tape at Top -->
  <polygon points="230,10 370,10 365,45 235,45" fill="url(#tape-grad)" opacity="0.9"/>

  <!-- Text Content in Handwriting Style -->
  <text x="120" y="125" font-family="cursive, sans-serif" font-size="36" font-weight="700" fill="#1c1917">Note to self :)</text>
  <text x="120" y="190" font-family="cursive, sans-serif" font-size="30" font-weight="600" fill="#292524">Don't settle for boring design.</text>
  <text x="120" y="250" font-family="cursive, sans-serif" font-size="28" font-weight="600" fill="#292524">Break the grid.</text>
  <text x="120" y="310" font-family="cursive, sans-serif" font-size="28" font-weight="600" fill="#292524">Push pixels until they jump.</text>

  <text x="120" y="430" font-family="cursive, sans-serif" font-size="26" font-weight="500" fill="#44403c">&#8226; Figma open 24/7</text>
  <text x="120" y="490" font-family="cursive, sans-serif" font-size="26" font-weight="500" fill="#44403c">&#8226; Vibe code into the night</text>
  <text x="120" y="550" font-family="cursive, sans-serif" font-size="26" font-weight="500" fill="#44403c">&#8226; Build what can't be ignored</text>

  <!-- Signature -->
  <text x="360" y="670" font-family="cursive, sans-serif" font-size="32" font-weight="700" fill="#0f172a">&#8212; Ganesh PS</text>
</svg>
